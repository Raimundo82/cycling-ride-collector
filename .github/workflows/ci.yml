name: Go CI

on:
  pull_request:
    types: 
      - opened
      - synchronize
      - reopened

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
          cache: true

      - name: Cache Go tool binaries
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-gobin-${{ hashFiles('.devcontainer/scripts/install-tools.sh') }}

      - name: Install developer tools
        run: |
          chmod +x .devcontainer/scripts/install-tools.sh
          .devcontainer/scripts/install-tools.sh

      - name: Check formatting
        run: make check-format

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: go build ./...